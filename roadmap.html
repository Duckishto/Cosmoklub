<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="assets/images/logo-tab.png">

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Roadmap | CosmoKlub</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"

  >

  <link
    rel="stylesheet"

  >

  <link
    rel="stylesheet"
    href="assets/css/loader.css"
  >

  <style>
    .brand-logo {
      display: block;
      width: auto;
      height: 48px;
      object-fit: contain;

      filter:
        drop-shadow(
          0 0 6px
          rgba(168, 85, 247, 0.3)
        );

      user-select: none;
      -webkit-user-drag: none;
    }

    @media (max-width: 480px) {
      .brand-logo {
        height: 40px;
      }
    }
  </style>
  <!-- Image fallback: any picture that fails to load (missing file) is
       swapped to the shared CosmoKlub placeholder so no broken-image
       icons appear. Covers <img> tags and the Vue-bound CSS hero
       backgrounds. PLACEHOLDER path is relative to this page. -->
  <script>
  (function () {
    var PLACEHOLDER = "assets/images/pensiaplaceholder.png";
    // Swap a failed <img> to the placeholder (once).
    function fixImg(img) {
      if (!img || img.dataset.phDone) return;
      img.dataset.phDone = "1";
      img.src = PLACEHOLDER;
      img.classList.add("is-placeholder");
    }
    // Capture load errors from any <img>, including ones added later by Vue.
    document.addEventListener("error", function (e) {
      var el = e.target;
      if (el && el.tagName === "IMG") fixImg(el);
    }, true);

    // Heroes use CSS background-image (no error event). After Vue paints,
    // test each hero's image URL and swap the background if it 404s.
    function fixHeroBackgrounds() {
      var heroes = document.querySelectorAll(".uc-hero, [data-bg-check]");
      heroes.forEach(function (h) {
        var bg = getComputedStyle(h).backgroundImage || "";
        var m = bg.match(/url\((['"]?)(.*?)\1\)/);
        if (!m || !m[2]) return;
        var url = m[2];
        if (url.indexOf("pensiaplaceholder") !== -1) return;
        var probe = new Image();
        probe.onerror = function () {
          h.style.backgroundImage = "url(" + PLACEHOLDER + ")";
          h.classList.add("hero-placeholder");
        };
        probe.src = url;
      });
    }
    // Run after Vue has had a chance to render (a few passes for safety).
    function scheduleHeroCheck() {
      [300, 900, 1800].forEach(function (t) { setTimeout(fixHeroBackgrounds, t); });
    }
    if (document.readyState === "complete" || document.readyState === "interactive") scheduleHeroCheck();
    else document.addEventListener("DOMContentLoaded", scheduleHeroCheck);
  })();
  </script>
</head>

<body>
  <div class="page-shell">

    <!-- Top navigation -->
    <div class="topbar">

      <a
        href="dashboard.html?tab=library"
        class="brand"
        aria-label="Return to the CosmoKlub Library"
      >
        <img
          class="brand-logo"
          src="assets/images/logo.png"
          alt="CosmoKlub"
          draggable="false"
        >
      </a>

      <div class="topbar-spacer"></div>

      <div class="topbar-actions">

        <button
          class="icon-btn"
          type="button"
          aria-label="Notifications"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"
            />

            <path
              d="M13.73 21a2 2 0 0 1-3.46 0"
            />
          </svg>

          <span class="icon-dot"></span>
        </button>

        <button
          class="icon-btn"
          type="button"
          aria-label="Settings"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle
              cx="12"
              cy="12"
              r="3"
            />

            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15z"
            />
          </svg>
        </button>

      </div>
    </div>

    <!-- Scrollable Roadmap page -->
    <div class="roadmap-scroll">

      <main class="roadmap-page">
        <div class="roadmap-shell">

          <div class="roadmap-header-row">

            <button
              id="libraryBack"
              class="library-back"
              type="button"
              aria-label="Back to Library"
            >
              <span class="library-back-arrow"></span>
            </button>

            <section class="category-hero">

              <div class="category-hero-main">

                <div class="category-kicker">
                  Study Roadmap
                </div>

                <div class="category-heading">

                  <div
                    class="category-icon"
                    id="categoryIcon"
                  >
                    ⭐
                  </div>

                  <div>
                    <h1 id="categoryTitle">
                      Stars
                    </h1>

                    <p id="categoryDescription"></p>
                  </div>

                </div>
              </div>

              <div class="category-rank-panel">

                <div class="category-rank-label">
                  Category Progress
                </div>

                <div
                  class="category-rank"
                  id="categoryRank"
                >
                  BRONZE
                </div>

                <div
                  class="category-level"
                  id="categoryLevel"
                >
                  Level 1
                </div>

                <div
                  class="category-xp"
                  id="categoryXp"
                >
                  0 XP
                </div>

                <div class="category-progress-track">

                  <div
                    id="categoryProgressFill"
                    class="category-progress-fill"
                  ></div>

                </div>

                <div class="category-progress-meta">

                  <span id="categoryProgressText">
                    0 / 20 complete
                  </span>

                  <span id="categoryNextLevel">
                    Next level: 20 XP
                  </span>

                </div>
              </div>

            </section>
          </div>

          <!-- Dynamically generated roadmap -->
          <div
            id="roadmapContainer"
            class="roadmap-container"
          ></div>

        </div>
      </main>

    </div>
  </div>

  <!-- Supabase -->
  <script src="assets/js/lib/supabase-client.js"></script>

  <!-- Course information -->
  <script src="assets/js/course-data.js"></script>

  <!-- User progress -->
  <script src="assets/js/progress.js"></script>

  <!-- Roadmap rendering and interactions -->
  <script src="assets/js/roadmap.js?v=2"></script>

  <!-- Shared loading screen -->
  <script src="assets/js/loader.js"></script>

</body>
</html>
