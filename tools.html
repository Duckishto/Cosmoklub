<!DOCTYPE html>
<html lang="en">
<head>
  <style>html,body{background:#07061a!important}</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>CosmoKlub: Tools</title>
  <meta name="description" content="NASA's image and video library, the Astronomy Picture of the Day, and a solar system object catalog — free, no account needed." />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- tools-page.css is the original object.css, unchanged: the nav, the page
       chrome and the tool styling exactly as this page has always looked.
       (dashboard.html instead loads tools.css — the same rules scoped under
       .tools-tab so they can't collide with the app shell.) -->
  <link rel="stylesheet" href="tools-page.css">
  <link rel="stylesheet" href="transition.css">

  <!-- Deliberately NO auth-guard.js: this page is public. It is the signed-out
       half of the Tools tab — same component, minus the Calculator and the app
       shell. Signed-in visitors get upgraded to the dashboard version by the
       script at the bottom.

       supabase-client.js only loads so we can tell whether someone is signed
       in; nothing on this page needs a session to work. -->
  <script src="api/supabase-client.js"></script>
</head>
<body>

<div class="aurora-wrap"><div class="aurora-base"></div><div class="aurora-1"></div><div class="aurora-2"></div><div class="aurora-3"></div></div>
<canvas id="star-canvas"></canvas>
<div class="page-grid"></div>

<div id="app" v-cloak>

  <!-- Navigation -->
  <nav :class="{ scrolled: navScrolled, compact: navCompact }">
    <a class="nav-logo" href="index.html">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="5" r="2.2" fill="#a855f7"/>
        <circle cx="5" cy="18" r="1.7" fill="#c084fc"/>
        <circle cx="21" cy="18" r="1.7" fill="#c084fc"/>
        <circle cx="13" cy="14" r="1.3" fill="#e9d5ff" opacity="0.7"/>
        <line x1="13" y1="5" x2="5" y2="18" stroke="#a855f7" stroke-width="1" stroke-opacity="0.55"/>
        <line x1="13" y1="5" x2="21" y2="18" stroke="#a855f7" stroke-width="1" stroke-opacity="0.55"/>
        <line x1="5" y1="18" x2="21" y2="18" stroke="#c084fc" stroke-width="1" stroke-opacity="0.45"/>
        <line x1="13" y1="5" x2="13" y2="14" stroke="#e9d5ff" stroke-width="0.8" stroke-opacity="0.4"/>
      </svg>
      CosmoKlub
    </a>
    <ul class="nav-links" :class="{open: mobileMenuOpen}">
      <li><a href="index.html">Home</a></li>
      <li><a href="tools.html" class="active-link" @click="mobileMenuOpen=false">Tools</a></li>
      <li><a href="team.html" @click="mobileMenuOpen=false">Our Team</a></li>
      <li><a href="staff-application.html" @click="mobileMenuOpen=false">Staff Application</a></li>
    </ul>
    <div class="nav-right">
      <div class="lang-wrap">
        <button class="lang-btn" @click="langOpen=!langOpen">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"/></svg>
          {{ currentLang.code }}
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="lang-dropdown" v-if="langOpen">
          <button v-for="l in langs" :key="l.code" :class="{active:currentLang.code===l.code}" @click="setLang(l)">{{ l.flag }} {{ l.name }}</button>
        </div>
      </div>
      <button
        class="nav-menu-btn"
        :class="{active: mobileMenuOpen}"
        @click="mobileMenuOpen = !mobileMenuOpen"
        aria-label="Toggle navigation menu"
        :aria-expanded="mobileMenuOpen"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Three tools only — the Calculator is a signed-in feature, so this page
       offers the same set object.html always did.

       NOTE: written as <tools ...></tools>, not <Tools ... />. This is an
       in-DOM template, so the browser's HTML parser reads it before Vue does,
       and a self-closing custom element there is not valid HTML — it silently
       swallows the rest of the page as children. -->
  <div class="content">
    <tools :show-calculator="false" layout="chips"></tools>

    <!-- The pitch for an account, below the tools people came here to use. -->
    <div class="public-cta">
      <h3>There's more inside</h3>
      <p>Create a free account for the forum, the lesson library, the calculator, XP and ranks.</p>
      <a class="public-cta-btn" href="index.html?login=1">Sign in or create an account</a>
    </div>
  </div>

</div>

<!-- No components/calculator.js here on purpose — it is 87 KB and this page
     never shows the Calculator. Tools registers it only when present. -->
<script src="common.js"></script>
<script src="solar-catalog.js"></script>
<script src="components/tools.js"></script>

<script>
  // Signed-in visitors belong on the dashboard version, which wraps the same
  // tools in the full app shell (and adds the Calculator).
  //
  // Unlike auth-guard.js this never hides the page while it checks — the
  // content is public, so showing it immediately is correct. The redirect only
  // upgrades the experience for people who already have an account.
  (async function upgradeSignedInVisitors() {
    try {
      const client = window.supabaseClient || (window.supabaseReady ? await window.supabaseReady : null);
      if (!client) return;
      const { data } = await client.auth.getSession();
      if (data && data.session) window.location.replace('dashboard.html?tab=tools');
    } catch (error) {
      console.warn('[CosmoKlub] Could not check the session on the public tools page.', error);
    }
  })();

  // Same lightweight nav/starfield/lang setup the old object.js had — kept
  // inline because the nav is all this page needs beyond the Tools component.
  Vue.createApp({
    components: { Tools },

    data() {
      return {
        mobileMenuOpen: false,
        langOpen: false,
        navScrolled: false,
        navCompact: false,
        currentLang: window.CosmoKlub.LANGS[0],
        langs: window.CosmoKlub.LANGS,
      };
    },

    methods: {
      setLang(l) { this.currentLang = l; this.langOpen = false; },
    },

    mounted() {
      window.CosmoKlub.initStarfield();

      window.addEventListener('scroll', () => {
        const y = window.scrollY;
        this.navScrolled = y > 20;
        this.navCompact = y > 80;
      }, { passive: true });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.lang-wrap')) this.langOpen = false;
      });
    },
  }).mount('#app');
</script>

<script src="transition.js"></script>
</body>
</html>
