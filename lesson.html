<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lesson | CosmoKlub</title>
  <link rel="stylesheet" href="lesson.css">
</head>
<body>
  <header class="site-header">
    <a href="dashboard.html" class="site-logo" aria-label="CosmoKlub home">
      <svg class="site-logo-mark" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="headerLogoGradient" x1="3" y1="3" x2="21" y2="21">
            <stop offset="0%" stop-color="#c084fc"/>
            <stop offset="55%" stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#7c3aed"/>
          </linearGradient>
        </defs>
        <path d="M12 3.5 4.4 18h15.2L12 3.5Z" fill="none" stroke="url(#headerLogoGradient)" stroke-width="1.7" stroke-linejoin="round"/>
        <circle cx="12" cy="3.5" r="1.8" fill="#a855f7"/>
        <circle cx="4.4" cy="18" r="1.5" fill="#c084fc"/>
        <circle cx="19.6" cy="18" r="1.5" fill="#a855f7"/>
        <circle cx="12" cy="12.8" r="1.2" fill="#a78bfa"/>
      </svg>
      <span>CosmoKlub</span>
    </a>
  </header>
  <main class="lesson-page">
    <div class="lesson-layout">
      <div class="back-column">
        <button id="roadmapBack" class="roadmap-back" type="button" aria-label="Back to roadmap">
          <span class="roadmap-back-arrow"></span>
        </button>
      </div>
      <div class="lesson-shell">
        <article class="lesson-card" id="lessonCover">
          <div class="lesson-cover-art">
            <div class="lesson-brand">COSMOKLUB</div>
            <div class="lesson-category" id="lessonCategory"></div>
            <h1 id="lessonTitle">Lesson</h1>
            <p id="lessonDescription"></p>
            <div class="lesson-cover-decoration">
              <div class="lesson-star">✦</div>
              <div class="orbit orbit-one"></div>
              <div class="orbit orbit-two"></div>
            </div>
          </div>
          <div class="lesson-cover-content">
            <div class="lesson-meta">
              <span class="lesson-meta-item">
                <span class="lesson-meta-icon">◷</span>
                <span id="lessonDuration"></span>
              </span>
              <span class="lesson-meta-item">
                <span class="lesson-meta-icon">✦</span>
                <span id="lessonXp"></span>
              </span>
            </div>
            <button id="startLearning" class="start-learning-button" type="button">
              Start Learning
            </button>
          </div>
        </article>
        <section id="learningExperience" class="learning-experience hidden">
          <div class="learning-topbar">
            <button id="exitLesson" class="learning-exit" type="button" aria-label="Exit lesson">
              ✕
            </button>
            <div class="learning-progress">
              <div id="learningProgressFill" class="learning-progress-fill"></div>
            </div>
            <span id="learningProgressText" class="learning-progress-text">1 / 1</span>
          </div>
          <div id="learningStage" class="learning-stage"></div>
        </section>
      </div>
    </div>
  </main>
  <script src="course-data.js"></script>
  <script src="progress.js"></script>
  <script src="lesson.js"></script>
  <script>
    const roadmapBack=document.getElementById('roadmapBack');
    if(roadmapBack){
      roadmapBack.addEventListener('click',()=>{
        const params=new URLSearchParams(window.location.search);
        const category=params.get('category')||'stars';
        window.location.href=`roadmap.html?category=${category}`;
      });
    }
  </script>
</body>
</html>
