<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>CosmoKlub Lesson</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="lesson.css">
</head>
<body>
  <div class="lesson-background"></div>

  <header class="lesson-nav">
    <a class="lesson-logo" href="dashboard.html">
      <span>△</span>
      CosmoKlub
    </a>
    <button id="backRoadmap" class="back-roadmap">← Roadmap</button>
  </header>

  <main class="lesson-page">
    <article class="lesson-card" id="lessonCover">
      <section class="lesson-cover">
        <div class="lesson-brand">COSMOKLUB</div>
        <div id="coverCategory" class="cover-category"></div>
        <h1 id="lessonTitle"></h1>
        <p id="lessonDescription"></p>

        <div class="orbit-decoration">
          <div class="orbit orbit-one"></div>
          <div class="orbit orbit-two"></div>
          <div class="orbit-planet">✦</div>
        </div>
      </section>

      <section class="lesson-details">
        <div class="lesson-label">
          <span id="lessonType"></span>
        </div>

        <h2 id="detailTitle"></h2>
        <p id="detailDescription" class="detail-description"></p>

        <div class="lesson-meta">
          <div>
            <span class="meta-icon">◷</span>
            <span id="lessonDuration"></span>
          </div>
          <div>
            <span class="meta-icon">✦</span>
            <span id="lessonXp"></span>
          </div>
        </div>

        <button id="startLessonButton" class="start-lesson">Start Learning</button>
      </section>
    </article>

    <section id="learningExperience" class="learning-experience hidden">
      <div class="learning-topbar">
        <button id="exitLesson" class="learning-exit">✕</button>
        <div class="learning-progress">
          <div id="learningProgressFill" class="learning-progress-fill"></div>
        </div>
        <span id="learningProgressText" class="learning-progress-text">1 / 1</span>
      </div>

      <div id="learningStage" class="learning-stage"></div>
    </section>
  </main>

  <script src="course-data.js"></script>
  <script src="lesson.js"></script>
</body>
</html>
