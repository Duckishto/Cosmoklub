<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>CosmoKlub: Forum & Library & Chat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- KaTeX — LaTeX math rendering for the calculator display -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <link rel="stylesheet" href="assets/css/dashboard.css?v=5">
  <!-- Study Roadmap header + Overall Rank panel (Library tab). Previously
       injected at runtime from a JS string in components/library.js, which
       made it fragile and was why the header/rank panel sometimes rendered
       unstyled. Now a real stylesheet, always loaded. Must come after
       dashboard.css since it uses the --stardust/--violet/etc. variables
       defined there. -->
  <link rel="stylesheet" href="assets/css/library.css?v=1">
  <!-- Profile + Settings tabs — every rule is scoped under .profile-tab so it
       can't reach the dashboard shell -->
  <link rel="stylesheet" href="assets/css/profile.css">
  <link rel="stylesheet" href="assets/css/loader.css">
</head>
<body>

<div class="aurora-wrap"><div class="aurora-base"></div><div class="aurora-1"></div><div class="aurora-2"></div><div class="aurora-3"></div></div>
<canvas id="star-canvas"></canvas>
<div class="page-grid"></div>

<div id="app">
  <div class="app-shell">

    <!-- Top bar -->
    <div class="topbar">
      <button type="button" class="brand" @click="setTab('forum')" aria-label="CosmoKlub home">
        <img class="brand-logo" src="assets/images/logo.png" alt="CosmoKlub" draggable="false" />
      </button>

      <div class="topbar-spacer"></div>

      <div class="topbar-actions">
        <button type="button" class="icon-btn" aria-label="Notifications" title="Notifications">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="icon-dot"></span>
        </button>

        <button type="button" class="icon-btn" :class="{'is-open': activeTab === 'settings'}"
                @click="setTab('settings')" aria-label="Settings" title="Settings">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>

        <!-- Hamburger: opens the navigation dropdown to the rest of CosmoKlub,
             styled after the marketing site's usecases nav-dropdown. -->
        <div class="tb-menu-wrap">
          <button type="button" class="icon-btn" :class="{'is-open': menuOpen}"
                  @click.stop="menuOpen = !menuOpen"
                  aria-haspopup="true" :aria-expanded="menuOpen" aria-label="Open navigation menu" title="Menu">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          </button>

          <div class="tb-pop" v-if="menuOpen" @click.stop>
            <span class="tb-pop-label">Navigate</span>
            <div class="tb-pop-grid">
              <a v-for="dest in navDestinations" :key="dest.key" href="javascript:void(0)"
                 class="tb-pop-item"
                 :class="{'is-active': dest.tab && activeTab === dest.tab, 'is-soon': !dest.tab}"
                 :aria-disabled="!dest.tab"
                 @click="goToDestination(dest)">
                <span class="tb-pop-ic" v-html="dest.icon"></span>
                <span class="tb-pop-text">
                  <strong>{{ dest.label }}<span class="tb-pop-soon" v-if="!dest.tab">Soon</span></strong>
                  <span>{{ dest.desc }}</span>
                </span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="content">
      <!-- Each tab is an independent component; see components/*.js.
           tabComponents maps tab name -> component, defined in app.js. -->
      <component :is="tabComponents[activeTab]"></component>
    </div>

  </div>
</div>

<!-- Shared helpers (starfield backdrop) -->
<script src="assets/js/common.js"></script>

<!-- Supabase client must load before progress.js, which uses it to sync
     XP/lesson-completions server-side for signed-in users -->
<script src="assets/js/lib/supabase-client.js"></script>

<!-- Library progression data must load before library.js -->
<script src="assets/js/course-data.js"></script>
<script src="assets/js/progress.js"></script>

<!-- Components must load before app.js, which registers and mounts them -->
<script src="assets/js/components/forum.js"></script>
<script src="assets/js/components/library.js?v=3"></script>
<script src="assets/js/components/chat.js"></script>
<script src="assets/js/components/planetarium.js"></script>
<script src="assets/js/components/profile.js"></script>
<script src="assets/js/components/settings.js"></script>

<script src="assets/js/app.js"></script>
  <script src="assets/js/loader.js"></script>
</body>
</html>
