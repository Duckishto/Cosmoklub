<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>CosmoKlub: Forum &amp; Library &amp; Chat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- KaTeX — LaTeX math rendering for the calculator display -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <link rel="stylesheet" href="assets/css/dashboard.css?v=17">
  <!-- Study Roadmap header + Overall Rank panel (Library tab). Previously
       injected at runtime from a JS string in components/library.js, which
       made it fragile and was why the header/rank panel sometimes rendered
       unstyled. Now a real stylesheet, always loaded. Must come after
       dashboard.css since it uses the --stardust/--violet/etc. variables
       defined there. -->
  <link rel="stylesheet" href="assets/css/library.css?v=1">

  <!-- Dashboard shell — the persistent left sidebar + slim header that
       replaced the old floating topbar pill. Loaded AFTER dashboard.css on
       purpose: it re-lays-out .app-shell / .content and neutralises the
       topbar rules that are still defined further up in dashboard.css.
       It also carries the shared page primitives (.pg-head, .ck-card,
       .seg-tabs, .ck-empty…) that profile.css and settings.css build on. -->
  <link rel="stylesheet" href="assets/css/dashboard-shell.css?v=4">

  <!-- Profile + Settings tabs — every rule is scoped under .profile-tab so it
       can't reach the dashboard shell -->
  <link rel="stylesheet" href="assets/css/profile.css?v=2">
  <!-- Settings tab — scoped under .settings-tab, same idea as profile.css -->
  <link rel="stylesheet" href="assets/css/settings.css?v=2">
  <link rel="stylesheet" href="assets/css/loader.css">
</head>
<body>

<div class="aurora-wrap"><div class="aurora-base"></div><div class="aurora-1"></div><div class="aurora-2"></div><div class="aurora-3"></div></div>
<canvas id="star-canvas"></canvas>
<div class="page-grid"></div>

<div id="app" v-cloak>
  <div class="app-shell" :class="{ 'sidebar-open': sidebarOpen }">

    <!-- =====================================================
         SIDEBAR — persistent navigation. Replaces the old
         floating .topbar pill entirely. Off-canvas below
         980px, opened by the header's hamburger.
         ===================================================== -->
    <aside class="sidebar" @click.stop>

      <div class="sb-brand">
        <button type="button" class="sb-brand-btn" @click="setTab('forum')" aria-label="CosmoKlub home">
          <img class="sb-brand-logo" src="assets/images/logo.png" alt="CosmoKlub" draggable="false" />
        </button>
        <button type="button" class="sb-close" @click="sidebarOpen = false" aria-label="Close menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>

      <!-- Account chip, in the slot OpenRouter gives its workspace
           switcher. Opens the Profile tab. -->
      <button type="button" class="sb-account" @click="setTab('profile')"
              :class="{ 'is-active': activeTab === 'profile' }">
        <span class="sb-account-av">
          <img v-if="account.avatarUrl" :src="account.avatarUrl" :alt="account.username" referrerpolicy="no-referrer" />
          <template v-else>{{ account.initial }}</template>
        </span>
        <span class="sb-account-text">
          <strong>{{ account.username }}</strong>
          <em>{{ account.signedIn ? 'Personal' : 'Not signed in' }}</em>
        </span>
        <svg class="sb-account-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>

      <nav class="sb-nav">
        <div class="sb-group">
          <a v-for="dest in primaryNav" :key="dest.key" href="javascript:void(0)"
             class="sb-item"
             :class="{ 'is-active': dest.tab && activeTab === dest.tab, 'is-soon': !dest.tab }"
             :aria-disabled="!dest.tab"
             @click="goToDestination(dest)">
            <span class="sb-ic" v-html="dest.icon"></span>
            <span class="sb-label">{{ dest.label }}</span>
            <span class="sb-soon" v-if="!dest.tab">Soon</span>
          </a>
        </div>

        <div class="sb-group">
          <span class="sb-group-label">Account</span>
          <a v-for="dest in accountNav" :key="dest.key" href="javascript:void(0)"
             class="sb-item"
             :class="{ 'is-active': dest.tab && activeTab === dest.tab && !dest.section, 'is-danger': dest.danger }"
             @click="goToDestination(dest)">
            <span class="sb-ic" v-html="dest.icon"></span>
            <span class="sb-label">{{ dest.label }}</span>
          </a>
        </div>
      </nav>

      <div class="sb-foot">
        <a class="sb-foot-link" href="index.html">Back to cosmoklub.com</a>
      </div>
    </aside>

    <div class="sb-scrim" v-if="sidebarOpen" @click="sidebarOpen = false"></div>

    <!-- =====================================================
         MAIN COLUMN — slim header + the scrolling tab area.
         ===================================================== -->
    <div class="shell-main">

      <header class="shell-header">
        <button type="button" class="hdr-menu" @click.stop="sidebarOpen = !sidebarOpen"
                aria-label="Open menu" :aria-expanded="sidebarOpen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>

        <span class="hdr-title">{{ pageTitle }}</span>

        <!-- Jump-to-anywhere search. Opens the overlay below; nothing here
             filters in place, it's a trigger, same as OpenRouter's field. -->
        <button type="button" class="hdr-search-btn" @click="openSearch"
                aria-label="Search Forum, Library, Calculator, Chat, Docs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span class="hdr-search-label">Search</span>
          <span class="hdr-search-kbd">/</span>
        </button>

        <!-- Home leaves the dashboard entirely for the marketing site; Docs
             stays inside the SPA as its own tab. Deliberately not in the
             sidebar — OpenRouter keeps these in the top strip too. -->
        <nav class="hdr-nav">
          <a class="hdr-nav-link" href="index.html" aria-label="CosmoKlub home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21V12h6v9"/></svg>
            <span class="hdr-nav-label">Home</span>
          </a>
          <a class="hdr-nav-link" href="javascript:void(0)" :class="{ 'is-active': activeTab === 'docs' }"
             @click="setTab('docs')" aria-label="Docs">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span class="hdr-nav-label">Docs</span>
          </a>
        </nav>

        <div class="hdr-spacer"></div>

        <!-- Rank + level readout. Deliberately NOT a button: Profile and
             Settings both live in the sidebar's ACCOUNT group, so the
             header shows status instead of repeating navigation. Fed by
             progress.js and refreshed on cosmoklub-progress-changed. -->
        <div class="hdr-xp" v-if="progress.ready" :title="xpTitle">
          <span class="hdr-xp-rank" :class="progress.rankClass">{{ progress.rank }}</span>
          <span class="hdr-xp-body">
            <span class="hdr-xp-top">
              <span class="hdr-xp-lvl">Level {{ progress.level }}</span>
              <span class="hdr-xp-val">{{ progress.xp.toLocaleString() }} XP</span>
            </span>
            <span class="hdr-xp-bar">
              <span class="hdr-xp-fill" :class="progress.rankClass"
                    :style="{ width: progress.percent + '%' }"></span>
            </span>
          </span>
        </div>

        <button type="button" class="hdr-icon" aria-label="Notifications" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="hdr-dot"></span>
        </button>
      </header>

      <div class="content">
        <!-- Each tab is an independent component; see components/*.js.
             tabComponents maps tab name -> component, defined in app.js. -->
        <component :is="tabComponents[activeTab]"></component>
      </div>

    </div>

  </div>

  <!-- ===================================================
       SEARCH OVERLAY — opened by the header's Search button
       (or the "/" shortcut). Jumps straight to a tab, or off
       to index.html for Home.
       =================================================== -->
  <div class="hdr-search-overlay" v-if="searchOpen" @click.self="closeSearch">
    <div class="hdr-search-panel">
      <div class="hdr-search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input ref="searchInput" v-model="searchQuery" type="text"
               placeholder="Search Forum, Library, Calculator, Chat, Docs…"
               @keydown.esc="closeSearch"
               @keydown.enter="goSearchResult(filteredSearchResults[0])" />
        <button type="button" class="hdr-search-close" @click="closeSearch" aria-label="Close search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>
      <div class="hdr-search-results">
        <button v-for="r in filteredSearchResults" :key="r.key" type="button"
                class="hdr-search-result" @click="goSearchResult(r)">
          <span class="hdr-search-result-ic" v-html="r.icon"></span>
          <span class="hdr-search-result-text">
            <strong>{{ r.label }}</strong>
            <em>{{ r.hint }}</em>
          </span>
        </button>
        <div v-if="!filteredSearchResults.length" class="hdr-search-empty">
          No matches for "{{ searchQuery }}"
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Shared helpers (starfield backdrop) -->
<script src="assets/js/common.js"></script>

<!-- Supabase client must load before progress.js, which uses it to sync
     XP/lesson-completions server-side for signed-in users -->
<script src="assets/js/lib/supabase-client.js"></script>

<!-- Forum data layer — every Supabase call the forum and profile tabs make -->
<script src="assets/js/lib/forum-api.js"></script>

<!-- Library progression data must load before library.js -->
<script src="assets/js/course-data.js"></script>
<script src="assets/js/progress.js"></script>

<!-- Components must load before app.js, which registers and mounts them -->
<script src="assets/js/components/forum.js?v=5"></script>
<script src="assets/js/components/library.js?v=3"></script>
<script src="assets/js/components/chat.js"></script>
<script src="assets/js/components/calculator.js"></script>
<script src="assets/js/components/profile.js?v=2"></script>
<script src="assets/js/components/settings.js?v=3"></script>
<script src="assets/js/components/docs.js?v=1"></script>

<script src="assets/js/app.js?v=4"></script>
  <script src="assets/js/loader.js"></script>
</body>
</html>
